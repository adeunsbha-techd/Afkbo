<!doctype html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cookie Bots</title>
<style>
:root{--bg:#1c1511;--panel:#2a201a;--line:#432f24;--text:#f3e9df;--mute:#a8957f;--accent:#ff9ab8;--ink:#2b1320;--ok:#8fd694;--warn:#f2c261;--bad:#ff7a6b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 ui-rounded,"Segoe UI",system-ui,sans-serif;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:12px;padding:16px 18px}
h1{font-size:1.35rem;margin:0;letter-spacing:-.01em}
.srv{color:var(--mute);font-size:.85rem;flex:1}
button{font:inherit;border:0;border-radius:12px;padding:10px 16px;background:var(--accent);color:var(--ink);font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--mute);box-shadow:inset 0 0 0 1px var(--line)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{flex:1;display:flex;flex-direction:column;gap:14px;padding:0 18px 18px;min-height:0;max-width:760px;width:100%;margin:0 auto}
#list{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:var(--panel);color:var(--text);box-shadow:inset 0 0 0 1px var(--line);font-weight:500}
.chip.on{box-shadow:inset 0 0 0 2px var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mute)}
.online .dot{background:var(--ok)}.connecting .dot{background:var(--warn)}
#panel{flex:1;display:flex;flex-direction:column;background:var(--panel);border-radius:20px;box-shadow:inset 0 0 0 1px var(--line);min-height:55dvh;overflow:hidden}
.bar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.bar button{padding:7px 12px;border-radius:10px}
.sp{flex:1}#st{color:var(--mute);font-size:.85rem}
#log{flex:1;overflow-y:auto;padding:12px 14px;font:.88rem/1.5 ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere}
#log div{padding:1px 0}.sys{color:var(--mute);font-style:italic}.me{color:var(--accent)}
#send{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
input{flex:1;min-width:0;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
#empty{color:var(--mute);text-align:center;margin:auto}
dialog{border:0;border-radius:20px;background:var(--panel);color:var(--text);padding:22px;width:min(92vw,380px);box-shadow:0 0 0 1px var(--line),0 20px 60px #0008}
dialog::backdrop{background:#000a}
dialog form{display:grid;gap:12px}dialog h2{margin:0;font-size:1.15rem}
.err{color:var(--bad);font-size:.88rem;min-height:1.2em}
.row{display:flex;gap:8px;justify-content:flex-end}
</style></head><body>
<header><h1>Cookie Bots</h1><span class="srv">cookiesmp.my.id</span><button id="add">Tambah akun</button></header>
<main>
  <nav id="list"></nav>
  <section id="panel" hidden>
    <div class="bar"><b id="who"></b><span id="st"></span><span class="sp"></span><button id="toggle"></button><button id="del" class="ghost">Hapus</button></div>
    <div id="log"></div>
    <form id="send"><input id="msg" placeholder="Ketik pesan atau /perintah" autocomplete="off"><button>Kirim</button></form>
  </section>
  <p id="empty">Belum ada akun. Tambahkan akun pertama untuk mulai.</p>
</main>

<dialog id="dlg"><form id="addf">
  <h2>Tambah akun</h2>
  <input id="u" placeholder="Username" autocomplete="off" required>
  <input id="p" type="password" placeholder="Password /login" autocomplete="off" required>
  <div class="err" id="e1"></div>
  <div class="row"><button type="button" class="ghost" id="c1">Batal</button><button>Tambah dan masuk</button></div>
</form></dialog>

<dialog id="gate"><form id="gf">
  <h2>Masukkan password panel</h2>
  <input id="gp" type="password" placeholder="Password panel" required>
  <div class="err" id="e2"></div>
  <div class="row"><button>Buka panel</button></div>
</form></dialog>

<script>
const $=s=>document.querySelector(s)
let pass=sessionStorage.p||'',accs=[],chats={},cur=null,shown=null
const LBL={offline:'Offline',connecting:'Menghubungkan',online:'Online'}
const api=(p,b)=>fetch('/api/'+p,{method:'POST',headers:{'content-type':'application/json','x-pass':pass},body:JSON.stringify(b||{})}).then(r=>r.json())

async function boot(){
  const r=await fetch('/api/ping',{headers:{'x-pass':pass}})
  if(r.status===401){$('#gate').showModal();return}
  const es=new EventSource('/events?p='+encodeURIComponent(pass))
  es.onmessage=e=>{
    const d=JSON.parse(e.data)
    if(d.type==='init'){accs=d.accounts;chats=d.chats}
    else if(d.type==='state')accs=d.accounts
    else{(chats[d.username]??=[]).push(d.line);if(d.username===cur)line(d.line);return}
    render()
  }
}
function line(l){
  const log=$('#log'),near=log.scrollHeight-log.scrollTop-log.clientHeight<80
  const d=document.createElement('div');d.className=l.kind;d.textContent=l.text;log.append(d)
  if(near)log.scrollTop=log.scrollHeight
}
function render(){
  if(!accs.find(a=>a.username===cur))cur=accs[0]?.username||null
  $('#empty').hidden=!!accs.length;$('#panel').hidden=!cur
  const list=$('#list');list.innerHTML=''
  for(const a of accs){
    const b=document.createElement('button');b.className='chip '+a.status+(a.username===cur?' on':'')
    b.innerHTML='<span class="dot"></span>';b.append(a.username)
    b.onclick=()=>{cur=a.username;render()};list.append(b)
  }
  const a=accs.find(x=>x.username===cur);if(!a)return
  $('#who').textContent=a.username;$('#st').textContent=LBL[a.status]
  $('#toggle').textContent=a.status==='offline'?'Jalankan':'Hentikan'
  if(shown!==cur){shown=cur;$('#log').innerHTML='';(chats[cur]||[]).forEach(line);$('#log').scrollTop=1e9}
}
$('#toggle').onclick=()=>{const a=accs.find(x=>x.username===cur);api(a.status==='offline'?'start':'stop',{username:cur})}
$('#del').onclick=()=>{if(confirm('Hapus akun '+cur+'?'))api('remove',{username:cur})}
$('#send').onsubmit=async e=>{e.preventDefault();const t=$('#msg').value.trim();if(!t)return
  const r=await api('say',{username:cur,text:t});if(r.error)line({kind:'sys',text:r.error});else $('#msg').value=''}
$('#add').onclick=()=>{$('#e1').textContent='';$('#dlg').showModal();$('#u').focus()}
$('#c1').onclick=()=>$('#dlg').close()
$('#addf').onsubmit=async e=>{e.preventDefault()
  const r=await api('add',{username:$('#u').value.trim(),password:$('#p').value})
  if(r.error){$('#e1').textContent=r.error;return}
  $('#addf').reset();$('#dlg').close();cur=$('#u').value||cur}
$('#gf').onsubmit=async e=>{e.preventDefault();pass=$('#gp').value
  const r=await fetch('/api/ping',{headers:{'x-pass':pass}})
  if(r.status===401){$('#e2').textContent='Password salah';return}
  sessionStorage.p=pass;$('#gate').close();boot()}
boot()
</script></body></html>
